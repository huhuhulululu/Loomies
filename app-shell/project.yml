# XcodeGen — ClosetApp（TestFlight 就绪）
# cd app-shell && xcodegen generate
name: ClosetApp
options:
  bundleIdPrefix: com.pinglin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug
  groupOrdering:
    - order: [ClosetApp, Products]

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: 28626PSX5Y
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "44"
    MARKETING_VERSION: "0.1.0"

packages:
  ClosetCore:
    path: ../Packages/ClosetCore
  ClosetModel:
    path: ../Packages/ClosetModel
  ClosetUI:
    path: ../Packages/ClosetUI
  ClosetIntake:
    path: ../Packages/ClosetIntake

targets:
  ClosetApp:
    type: application
    platform: iOS
    sources:
      - path: ClosetApp
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinglin.closet
        PRODUCT_NAME: Loomies
        INFOPLIST_KEY_CFBundleDisplayName: Loomies
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan garments into your closet."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Import garment photos into your closet."
        # 出口合规：无非豁免加密（仅 HTTPS）
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ClosetApp/ClosetApp.entitlements
        # App Store / TestFlight
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Release:
          # 仅 App 目标 Manual（勿在 CLI 全局设 PROVISIONING_PROFILE，会污染 SPM 资源包）
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution: Ping Lin (28626PSX5Y)"
          PROVISIONING_PROFILE_SPECIFIER: "Closet App Store TF2"
          ONLY_ACTIVE_ARCH: NO
          SWIFT_OPTIMIZATION_LEVEL: -O
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Debug:
          ONLY_ACTIVE_ARCH: YES
          CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ClosetCore
      - package: ClosetModel
      - package: ClosetUI
      - package: ClosetIntake
      # D197：Widget 随 App embed。C1 完成前不要打进 IPA——
      # 本机没有「Loomies Widget App Store」profile（build 43 也是 embed 之前上去的）。
      # TESTFLIGHT.md：没注册 App Group 不要把 Widget 发出去。
      # - target: LoomiesWidgetExtension
    scheme:
      testTargets: []
      gatherCoverageData: false
      buildTargets:
        - ClosetApp

  # D197：主屏 Widget（今天穿什么，不用开 App）。
  # 只依赖 ClosetCore —— 纯 Foundation，不拖 SwiftData 进 extension 进程。
  LoomiesWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: LoomiesWidget
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinglin.closet.widget
        PRODUCT_NAME: LoomiesWidget
        INFOPLIST_KEY_CFBundleDisplayName: Loomies
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: LoomiesWidget/LoomiesWidget.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          # ⚠️ 需要一个**独立**的 App Store profile（App 那张不含此 bundle id）。
          # 未生成前 Release 归档会失败——见 TESTFLIGHT.md 的 App Group 一节。
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution: Ping Lin (28626PSX5Y)"
          PROVISIONING_PROFILE_SPECIFIER: "Loomies Widget App Store"
        Debug:
          CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ClosetCore
