# XcodeGen — ClosetApp（TestFlight 就绪）
# cd app-shell && xcodegen generate
name: ClosetApp
options:
  bundleIdPrefix: com.pinglin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug
  groupOrdering:
    - order: [ClosetApp, Products]

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: 28626PSX5Y
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "12"
    MARKETING_VERSION: "0.1.0"

packages:
  ClosetCore:
    path: ../Packages/ClosetCore
  ClosetModel:
    path: ../Packages/ClosetModel
  ClosetUI:
    path: ../Packages/ClosetUI
  ClosetIntake:
    path: ../Packages/ClosetIntake

targets:
  ClosetApp:
    type: application
    platform: iOS
    sources:
      - path: ClosetApp
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinglin.closet
        PRODUCT_NAME: Loomies
        INFOPLIST_KEY_CFBundleDisplayName: Loomies
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan garments into your closet."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Import garment photos into your closet."
        # 出口合规：无非豁免加密（仅 HTTPS）
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ClosetApp/ClosetApp.entitlements
        # App Store / TestFlight
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Release:
          # 仅 App 目标 Manual（勿在 CLI 全局设 PROVISIONING_PROFILE，会污染 SPM 资源包）
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution: Ping Lin (28626PSX5Y)"
          PROVISIONING_PROFILE_SPECIFIER: "Closet App Store TF2"
          ONLY_ACTIVE_ARCH: NO
          SWIFT_OPTIMIZATION_LEVEL: -O
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Debug:
          ONLY_ACTIVE_ARCH: YES
          CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ClosetCore
      - package: ClosetModel
      - package: ClosetUI
      - package: ClosetIntake
    scheme:
      testTargets: []
      gatherCoverageData: false
      buildTargets:
        - ClosetApp
