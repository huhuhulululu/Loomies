# ============================================================================
# CI — D213（main）+ D215（fleet 合入）
#
#  1. iOS-only code that macOS `swift test` can NEVER compile (D92).
#     Only `xcodebuild` against an iOS destination proves those `#if os(iOS)`
#     blocks compile. The ios-build job is mandatory, not polish.
#
#  2. Performance gates that skip on the busy dev box (D211: load 17-38).
#     ClosetModel runs `--no-parallel` so an idle runner can actually execute
#     the three time-sensitive gates instead of reporting a green that measured
#     nothing.
#
#  3. Remote: https://github.com/huhuhulululu/Loomies (C11 done 2026-08-21).
#     First Actions run: read "Show toolchain" and confirm Xcode 26 is present.
#
# Runner: macos-26, pin Xcode 26.x (prefer 26.2). No Xcode 26 → hard fail,
# never a fake green against the wrong SDK. `macos-latest` is avoided.
# No `.build` cache (D200 stale-SwiftPM segfault). No secrets.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: swift test · ${{ matrix.package }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ClosetCore
            extra: ""
          - package: ClosetModel
            extra: "--no-parallel"
          - package: ClosetUI
            extra: ""
          - package: ClosetIntake
            extra: ""
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          ls /Applications | grep -i xcode || true
          sysctl -n hw.ncpu
          uptime
          xcodebuild -version

      - name: Select Xcode 26 (Swift 6.2 + iOS 26 SDK; honest fail if absent)
        run: |
          set -euo pipefail
          dev="/Applications/Xcode_26.2.app"
          [ -d "$dev" ] || dev="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$dev" ]; then
            echo "::error::No Xcode 26.x on this runner (repo needs Swift 6.2 + an iOS 26 SDK). Refusing to fake a green build."
            exit 1
          fi
          sudo xcode-select -s "$dev"
          xcodebuild -version
          swift --version

      # swift-testing failures land on stdout (D209) — do not capture stderr only
      - name: swift test · ${{ matrix.package }}
        run: swift test --package-path Packages/${{ matrix.package }} ${{ matrix.extra }}

  ios-build:
    name: xcodebuild · generic/platform=iOS (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2 + iOS 26 SDK; honest fail if absent)
        run: |
          set -euo pipefail
          dev="/Applications/Xcode_26.2.app"
          [ -d "$dev" ] || dev="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$dev" ]; then
            echo "::error::No Xcode 26.x on this runner (repo needs Swift 6.2 + an iOS 26 SDK). Refusing to fake a green build."
            exit 1
          fi
          sudo xcode-select -s "$dev"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # project.yml is the source of truth — regenerate so CI never depends on
      # a committed .xcodeproj staying in sync (D213 left that as a follow-up).
      - name: xcodegen generate
        working-directory: app-shell
        run: xcodegen generate

      - name: xcodebuild (unsigned iOS compile)
        run: |
          xcodebuild \
            -project app-shell/ClosetApp.xcodeproj \
            -scheme ClosetApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
